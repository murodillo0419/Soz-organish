<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>600 ta eng kerakli inglizcha so'z</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card-front: #ffffff;
    --card-back: #2f6f5e;
    --accent: #d9622b;
    --text-dark: #24302a;
    --text-light: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text-dark);
    padding: 16px;
  }
  header {
    text-align: center;
    margin-bottom: 14px;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 4px 0;
  }
  p.sub {
    margin: 0;
    font-size: 0.85rem;
    color: #666;
  }
  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 12px 0;
    flex-wrap: wrap;
  }
  .controls input {
    flex: 1;
    min-width: 160px;
    max-width: 320px;
    padding: 8px 12px;
    border-radius: 20px;
    border: 1px solid #ccc;
    font-size: 0.9rem;
  }
  .counter {
    text-align: center;
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 10px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .card-wrap {
    perspective: 800px;
    height: 90px;
    cursor: pointer;
  }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s;
    transform-style: preserve-3d;
  }
  .card.flipped {
    transform: rotateY(180deg);
  }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .front {
    background: var(--card-front);
    color: var(--text-dark);
    border: 1px solid #e3ddcf;
    font-size: 1rem;
  }
  .back {
    background: var(--card-back);
    color: var(--text-light);
    transform: rotateY(180deg);
    font-size: 0.95rem;
  }
  .card-wrap.speaking .front {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent);
  }
  .icon {
    font-size: 0.7rem;
    opacity: 0.5;
    position: absolute;
    bottom: 4px;
    right: 8px;
  }
  .hidden { display: none !important; }
  .card-wrap.dim { opacity: 0.25; }
  .card-wrap.match .front {
    border-color: var(--accent);
  }
  .card-wrap.current .front {
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 4px rgba(217,98,43,0.25);
    transform: scale(1.06);
  }
  .card-wrap.current { transition: transform 0.2s; }
</style>
</head>
<body>

<header>
  <h1>600 ta eng kerakli inglizcha so'z</h1>
  <p class="sub">1-bosish: talaffuz &nbsp;|&nbsp; 2-bosish: o'zbekcha tarjima &nbsp;|&nbsp; 3-bosish: asl holatiga qaytadi</p>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="So'z qidirish... (Enter — keyingisiga o'tish)">
</div>
<div class="counter" id="counter"></div>

<div class="grid" id="grid"></div>

const grid = document.getElementById('grid');
const counter = document.getElementById('counter');
const searchBox = document.getElementById('search');

function speak(text) {
  try {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  } catch (e) {
    console.log('TTS error', e);
  }
}

function buildCard(en, uz) {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.dataset.state = '0';

  const card = document.createElement('div');
  card.className = 'card';

  const front = document.createElement('div');
  front.className = 'face front';
  front.textContent = en;

  const back = document.createElement('div');
  back.className = 'face back';
  back.textContent = uz;

  card.appendChild(front);
  card.appendChild(back);
  wrap.appendChild(card);

  wrap.addEventListener('click', () => {
    let state = parseInt(wrap.dataset.state, 10);
    state = (state + 1) % 3;
    wrap.dataset.state = String(state);

    if (state === 1) {
      // 1-klik: talaffuz qilish, old tomonda qoladi
      card.classList.remove('flipped');
      wrap.classList.add('speaking');
      speak(en);
      setTimeout(() => wrap.classList.remove('speaking'), 700);
    } else if (state === 2) {
      // 2-klik: aylanib, o'zbekchasini ko'rsatish
      card.classList.add('flipped');
    } else {
      // 3-klik: asl holatiga qaytish
      card.classList.remove('flipped');
    }
  });

  wrap._enText = en.toLowerCase();
  return wrap;
}

// Butun to'plam faqat bir marta chiziladi, keyin qidiruv shu kartalar ustida ishlaydi
const cardEls = WORDS.map(([en, uz]) => buildCard(en, uz));
const frag = document.createDocumentFragment();
cardEls.forEach(el => frag.appendChild(el));
grid.appendChild(frag);
counter.textContent = WORDS.length + " ta so'z";

let matches = [];
let currentMatchIndex = -1;

function clearHighlights() {
  cardEls.forEach(el => el.classList.remove('dim', 'match', 'current'));
}

function goToMatch(idx) {
  cardEls.forEach(el => el.classList.remove('current'));
  const el = cardEls[matches[idx]];
  if (!el) return;
  el.classList.add('current');
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function runSearch() {
  const q = searchBox.value.trim().toLowerCase();
  currentMatchIndex = -1;

  if (!q) {
    clearHighlights();
    matches = [];
    counter.textContent = WORDS.length + " ta so'z";
    return;
  }

  matches = [];
  cardEls.forEach((el, i) => {
    const [en, uz] = WORDS[i];
    const found = en.toLowerCase().includes(q) || uz.toLowerCase().includes(q);
    el.classList.toggle('match', found);
    el.classList.toggle('dim', !found);
    el.classList.remove('current');
    if (found) matches.push(i);
  });

  counter.textContent = matches.length
    ? matches.length + " ta topildi — o'zi birinchisiga o'tdi"
    : "Hech narsa topilmadi";

  // O'zi avtomatik ravishda birinchi topilgan so'zga o'tadi
  if (matches.length) {
    currentMatchIndex = 0;
    goToMatch(currentMatchIndex);
  }
}

searchBox.addEventListener('input', runSearch);

searchBox.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && matches.length) {
    e.preventDefault();
    currentMatchIndex = (currentMatchIndex + 1) % matches.length;
    goToMatch(currentMatchIndex);
    counter.textContent = (currentMatchIndex + 1) + " / " + matches.length + " ta mos so'z";
  }
});
</script>
