<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>600 ta eng kerakli inglizcha so'z</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card-front: #ffffff;
    --card-back: #2f6f5e;
    --accent: #d9622b;
    --text-dark: #24302a;
    --text-light: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text-dark);
    padding: 16px;
    padding-bottom: 84px; /* pastki menyu uchun joy */
  }

  /* ===== Header ===== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1100px;
    margin: 0 auto 8px auto;
  }
  .topbar-title { flex: 1; text-align: center; }
  h1 { font-size: 1.2rem; margin: 0 0 2px 0; }
  p.sub { margin: 0; font-size: 0.8rem; color: #666; }

  .avatar-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 2px solid var(--card-back);
    background: var(--card-back);
    color: #fff;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 1rem;
  }
  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-spacer { width: 42px; flex-shrink: 0; }

  /* ===== Controls / grid (mavjud) ===== */
  .controls { display: flex; gap: 8px; justify-content: center; margin: 12px 0; flex-wrap: wrap; }
  .controls input {
    flex: 1; min-width: 160px; max-width: 320px;
    padding: 8px 12px; border-radius: 20px; border: 1px solid #ccc; font-size: 0.9rem;
  }
  .counter { text-align: center; font-size: 0.8rem; color: #888; margin-bottom: 10px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px; max-width: 1100px; margin: 0 auto;
  }
  .card-wrap { perspective: 800px; height: 90px; cursor: pointer; }
  .card { position: relative; width: 100%; height: 100%; transition: transform 0.5s; transform-style: preserve-3d; }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 6px; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .front { background: var(--card-front); color: var(--text-dark); border: 1px solid #e3ddcf; font-size: 1rem; }
  .back { background: var(--card-back); color: var(--text-light); transform: rotateY(180deg); font-size: 0.95rem; }
  .card-wrap.speaking .front { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .hidden { display: none !important; }
  .card-wrap.dim { opacity: 0.25; }
  .card-wrap.match .front { border-color: var(--accent); }
  .card-wrap.current .front {
    border: 2px solid var(--accent); box-shadow: 0 0 0 4px rgba(217,98,43,0.25); transform: scale(1.06);
  }
  .card-wrap.current { transition: transform 0.2s; }

  /* ===== Pastki menyu ===== */
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #fff; border-top: 1px solid #e3ddcf;
    display: flex; justify-content: center; gap: 10px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 40;
  }
  .bottom-nav button {
    flex: 1; max-width: 260px;
    padding: 12px 10px; border-radius: 12px; border: none;
    background: var(--card-back); color: #fff; font-weight: 700; font-size: 0.95rem;
    cursor: pointer;
  }
  .bottom-nav button.secondary { background: #eee; color: var(--text-dark); }

  /* ===== Overlaylar (login, profil) ===== */
  .overlay {
    position: fixed; inset: 0; background: rgba(20,20,20,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal {
    background: #fff; border-radius: 16px; padding: 22px 20px;
    width: 100%; max-width: 360px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .modal h2 { margin: 0 0 6px 0; font-size: 1.15rem; }
  .modal p.desc { margin: 0 0 16px 0; font-size: 0.85rem; color: #777; }
  .modal input[type="text"], .modal input[type="tel"] {
    width: 100%; padding: 11px 14px; margin-bottom: 12px;
    border-radius: 10px; border: 1px solid #ccc; font-size: 0.95rem;
  }
  .modal .big-btn {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer;
  }
  .modal .link-btn {
    margin-top: 10px; background: none; border: none; color: #777;
    font-size: 0.85rem; text-decoration: underline; cursor: pointer;
  }
  .profile-photo-preview {
    width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 14px auto;
    background: var(--card-back); color: #fff; font-size: 1.8rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .profile-photo-preview img { width: 100%; height: 100%; object-fit: cover; }
  .modal .file-btn {
    display: inline-block; margin-bottom: 14px; padding: 8px 14px;
    border-radius: 20px; border: 1px solid #ccc; font-size: 0.85rem; cursor: pointer; color: var(--text-dark);
  }
  .modal .file-btn input { display: none; }
  .modal .profile-row {
    text-align: left; font-size: 0.9rem; margin-bottom: 8px; color: #444;
  }
  .modal .profile-row b { color: var(--text-dark); }

  /* ===== O'yin (Game) ===== */
  #gameView {
    max-width: 480px; margin: 0 auto; text-align: center;
  }
  .game-progress { font-size: 0.85rem; color: #666; margin-bottom: 14px; }
  .game-progress-bar {
    height: 6px; background: #e3ddcf; border-radius: 3px; overflow: hidden; margin-bottom: 18px;
  }
  .game-progress-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
  .game-card {
    background: #fff; border: 1px solid #e3ddcf; border-radius: 20px;
    min-height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 30px 20px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  .game-word-en { font-size: 2rem; font-weight: 800; color: var(--text-dark); }
  .game-word-uz { font-size: 1.3rem; font-weight: 700; color: var(--card-back); margin-top: 14px; display: none; }
  .game-hint { font-size: 0.8rem; color: #999; margin-top: 18px; }
  .game-controls { display: flex; gap: 10px; margin-top: 18px; }
  .game-controls button {
    flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; font-size: 0.9rem;
  }
  .game-controls .back-btn { background: #eee; color: var(--text-dark); }
  .game-controls .restart-btn { background: var(--card-back); color: #fff; }
  .game-done { padding: 30px 10px; }
  .game-done h2 { color: var(--card-back); }
</style>
</head>
<body>

<div class="topbar">
  <div class="avatar-spacer"></div>
  <div class="topbar-title">
    <h1>600 ta eng kerakli inglizcha so'z</h1>
    <p class="sub">1-bosish: talaffuz &nbsp;|&nbsp; 2-bosish: o'zbekcha tarjima &nbsp;|&nbsp; 3-bosish: asl holat</p>
  </div>
  <div class="avatar-btn" id="avatarBtn">?</div>
</div>

<div id="mainView">
  <div class="controls">
    <input type="text" id="search" placeholder="So'z qidirish... (Enter — keyingisiga o'tish)">
  </div>
  <div class="counter" id="counter"></div>
  <div class="grid" id="grid"></div>
</div>

<div id="gameView" class="hidden"></div>

<div class="bottom-nav">
  <button id="openGameBtn">🎮 So'z o'yini</button>
  <button id="backToGridBtn" class="secondary hidden">📋 Barcha so'zlar</button>
</div>

<!-- Kirish (login) overlay -->
<div class="overlay hidden" id="loginOverlay">
  <div class="modal">
    <h2>Xush kelibsiz!</h2>
    <p class="desc">Davom etish uchun ismingiz va telefon raqamingizni kiriting</p>
    <input type="text" id="loginName" placeholder="Ismingiz">
    <input type="tel" id="loginPhone" placeholder="Telefon raqamingiz">
    <button class="big-btn" id="loginSubmitBtn">Davom etish</button>
  </div>
</div>

<!-- Profil overlay -->
<div class="overlay hidden" id="profileOverlay">
  <div class="modal">
    <div class="profile-photo-preview" id="profilePhotoPreview">?</div>
    <label class="file-btn">
      📷 Rasm qo'yish
      <input type="file" id="photoInput" accept="image/*">
    </label>
    <div class="profile-row"><b>Ism:</b> <span id="profileNameShow"></span></div>
    <div class="profile-row"><b>Telefon:</b> <span id="profilePhoneShow"></span></div>
    <button class="big-btn" id="profileCloseBtn">Yopish</button>
  </div>
</div>

/* ============ Foydalanuvchi profili (localStorage) ============ */
const PROFILE_KEY = 'uzWordsProfile_v1';
const PROGRESS_KEY = 'uzWordsGameProgress_v1';

function loadProfile() {
  try {
    const raw = localStorage.getItem(PROFILE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveProfile(p) {
  try { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); } catch (e) {}
}
function loadProgress() {
  try {
    const raw = localStorage.getItem(PROGRESS_KEY);
    const n = raw ? parseInt(raw, 10) : 0;
    return isNaN(n) ? 0 : n;
  } catch (e) { return 0; }
}
function saveProgress(n) {
  try { localStorage.setItem(PROGRESS_KEY, String(n)); } catch (e) {}
}

const loginOverlay = document.getElementById('loginOverlay');
const loginName = document.getElementById('loginName');
const loginPhone = document.getElementById('loginPhone');
const loginSubmitBtn = document.getElementById('loginSubmitBtn');

const avatarBtn = document.getElementById('avatarBtn');
const profileOverlay = document.getElementById('profileOverlay');
const profilePhotoPreview = document.getElementById('profilePhotoPreview');
const profileNameShow = document.getElementById('profileNameShow');
const profilePhoneShow = document.getElementById('profilePhoneShow');
const photoInput = document.getElementById('photoInput');
const profileCloseBtn = document.getElementById('profileCloseBtn');

function initialsOf(name) {
  if (!name) return '?';
  return name.trim().charAt(0).toUpperCase();
}

function renderAvatar() {
  const p = loadProfile();
  if (!p) return;
  if (p.photo) {
    avatarBtn.innerHTML = '<img src="' + p.photo + '" alt="profil">';
    profilePhotoPreview.innerHTML = '<img src="' + p.photo + '" alt="profil">';
  } else {
    const letter = initialsOf(p.name);
    avatarBtn.textContent = letter;
    profilePhotoPreview.textContent = letter;
  }
  profileNameShow.textContent = p.name || '-';
  profilePhoneShow.textContent = p.phone || '-';
}

function ensureLoggedIn() {
  const p = loadProfile();
  if (!p || !p.name || !p.phone) {
    loginOverlay.classList.remove('hidden');
  } else {
    loginOverlay.classList.add('hidden');
    renderAvatar();
  }
}

loginSubmitBtn.addEventListener('click', () => {
  const name = loginName.value.trim();
  const phone = loginPhone.value.trim();
  if (!name || !phone) {
    loginName.style.borderColor = name ? '#ccc' : '#d9622b';
    loginPhone.style.borderColor = phone ? '#ccc' : '#d9622b';
    return;
  }
  const existing = loadProfile() || {};
  existing.name = name;
  existing.phone = phone;
  saveProfile(existing);
  loginOverlay.classList.add('hidden');
  renderAvatar();
});

avatarBtn.addEventListener('click', () => {
  renderAvatar();
  profileOverlay.classList.remove('hidden');
});
profileCloseBtn.addEventListener('click', () => {
  profileOverlay.classList.add('hidden');
});

photoInput.addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const p = loadProfile() || {};
    p.photo = reader.result;
    saveProfile(p);
    renderAvatar();
  };
  reader.readAsDataURL(file);
});

ensureLoggedIn();

/* ============ Asosiy ro'yxat (mavjud funksiyalar) ============ */
const grid = document.getElementById('grid');
const counter = document.getElementById('counter');
const searchBox = document.getElementById('search');

function speak(text) {
  try {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  } catch (e) {
    console.log('TTS error', e);
  }
}

function buildCard(en, uz) {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.dataset.state = '0';

  const card = document.createElement('div');
  card.className = 'card';

  const front = document.createElement('div');
  front.className = 'face front';
  front.textContent = en;

  const back = document.createElement('div');
  back.className = 'face back';
  back.textContent = uz;

  card.appendChild(front);
  card.appendChild(back);
  wrap.appendChild(card);

  wrap.addEventListener('click', () => {
    let state = parseInt(wrap.dataset.state, 10);
    state = (state + 1) % 3;
    wrap.dataset.state = String(state);

    if (state === 1) {
      card.classList.remove('flipped');
      wrap.classList.add('speaking');
      speak(en);
      setTimeout(() => wrap.classList.remove('speaking'), 700);
    } else if (state === 2) {
      card.classList.add('flipped');
    } else {
      card.classList.remove('flipped');
    }
  });

  wrap._enText = en.toLowerCase();
  return wrap;
}

const cardEls = WORDS.map(([en, uz]) => buildCard(en, uz));
const gridFrag = document.createDocumentFragment();
cardEls.forEach(el => gridFrag.appendChild(el));
grid.appendChild(gridFrag);
counter.textContent = WORDS.length + " ta so'z";

let matches = [];
let currentMatchIndex = -1;

function clearHighlights() {
  cardEls.forEach(el => el.classList.remove('dim', 'match', 'current'));
}
function goToMatch(idx) {
  cardEls.forEach(el => el.classList.remove('current'));
  const el = cardEls[matches[idx]];
  if (!el) return;
  el.classList.add('current');
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function runSearch() {
  const q = searchBox.value.trim().toLowerCase();
  currentMatchIndex = -1;
  if (!q) {
    clearHighlights();
    matches = [];
    counter.textContent = WORDS.length + " ta so'z";
    return;
  }
  matches = [];
  cardEls.forEach((el, i) => {
    const [en, uz] = WORDS[i];
    const found = en.toLowerCase().includes(q) || uz.toLowerCase().includes(q);
    el.classList.toggle('match', found);
    el.classList.toggle('dim', !found);
    el.classList.remove('current');
    if (found) matches.push(i);
  });
  counter.textContent = matches.length
    ? matches.length + " ta topildi — o'zi birinchisiga o'tdi"
    : "Hech narsa topilmadi";
  if (matches.length) {
    currentMatchIndex = 0;
    goToMatch(currentMatchIndex);
  }
}
searchBox.addEventListener('input', runSearch);
searchBox.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && matches.length) {
    e.preventDefault();
    currentMatchIndex = (currentMatchIndex + 1) % matches.length;
    goToMatch(currentMatchIndex);
    counter.textContent = (currentMatchIndex + 1) + " / " + matches.length + " ta mos so'z";
  }
});

/* ============ So'z o'yini (Game mode) ============ */
const mainView = document.getElementById('mainView');
const gameView = document.getElementById('gameView');
const openGameBtn = document.getElementById('openGameBtn');
const backToGridBtn = document.getElementById('backToGridBtn');

let gameIndex = loadProgress();
let revealed = false;

function renderGame() {
  gameView.innerHTML = '';

  if (gameIndex >= WORDS.length) {
    const done = document.createElement('div');
    done.className = 'game-done';
    done.innerHTML = '<h2>🎉 Tabriklaymiz!</h2><p>Siz barcha 600 ta so\'zni o\'rgandingiz.</p>';
    const restartBtn = document.createElement('button');
    restartBtn.className = 'big-btn';
    restartBtn.textContent = "Boshidan boshlash";
    restartBtn.addEventListener('click', () => {
      gameIndex = 0;
      saveProgress(gameIndex);
      revealed = false;
      renderGame();
    });
    done.appendChild(restartBtn);
    gameView.appendChild(done);
    return;
  }

  const [en, uz] = WORDS[gameIndex];

  const progress = document.createElement('div');
  progress.className = 'game-progress';
  progress.textContent = "O'rgangan so'zlar: " + gameIndex + " / " + WORDS.length;
  gameView.appendChild(progress);

  const barWrap = document.createElement('div');
  barWrap.className = 'game-progress-bar';
  const barFill = document.createElement('div');
  barFill.className = 'game-progress-bar-fill';
  barFill.style.width = Math.round((gameIndex / WORDS.length) * 100) + '%';
  barWrap.appendChild(barFill);
  gameView.appendChild(barWrap);

  const card = document.createElement('div');
  card.className = 'game-card';

  const enEl = document.createElement('div');
  enEl.className = 'game-word-en';
  enEl.textContent = en;

  const uzEl = document.createElement('div');
  uzEl.className = 'game-word-uz';
  uzEl.textContent = uz;
  if (revealed) uzEl.style.display = 'block';

  const hint = document.createElement('div');
  hint.className = 'game-hint';
  hint.textContent = revealed ? "Keyingi so'z uchun bosing →" : "Tarjima va talaffuz uchun bosing";

  card.appendChild(enEl);
  card.appendChild(uzEl);
  card.appendChild(hint);

  card.addEventListener('click', () => {
    if (!revealed) {
      revealed = true;
      speak(en);
      renderGame();
    } else {
      gameIndex += 1;
      saveProgress(gameIndex);
      revealed = false;
      renderGame();
    }
  });

  gameView.appendChild(card);

  const controls = document.createElement('div');
  controls.className = 'game-controls';

  const backBtn = document.createElement('button');
  backBtn.className = 'back-btn';
  backBtn.textContent = "Ortga";
  backBtn.addEventListener('click', showGrid);

  const restartBtn = document.createElement('button');
  restartBtn.className = 'restart-btn';
  restartBtn.textContent = "Boshidan";
  restartBtn.addEventListener('click', () => {
    gameIndex = 0;
    saveProgress(gameIndex);
    revealed = false;
    renderGame();
  });

  controls.appendChild(backBtn);
  controls.appendChild(restartBtn);
  gameView.appendChild(controls);
}

function showGame() {
  mainView.classList.add('hidden');
  gameView.classList.remove('hidden');
  openGameBtn.classList.add('hidden');
  backToGridBtn.classList.remove('hidden');
  gameIndex = loadProgress();
  revealed = false;
  renderGame();
}

function showGrid() {
  gameView.classList.add('hidden');
  mainView.classList.remove('hidden');
  openGameBtn.classList.remove('hidden');
  backToGridBtn.classList.add('hidden');
}

openGameBtn.addEventListener('click', showGame);
backToGridBtn.addEventListener('click', showGrid);
</script>
